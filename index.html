<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Region OCR — Select & Extract</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 900px; margin: 30px auto; padding: 0 15px; }
  #dropzone { border: 2px dashed #999; padding: 30px; text-align: center; color: #666; cursor: pointer; margin-bottom: 15px; }
  #canvasWrap { position: relative; display: inline-block; max-width: 100%; }
  #imgCanvas { max-width: 100%; display: block; cursor: crosshair; border: 1px solid #ccc; touch-action: none; }
  #selBox { position: absolute; border: 2px solid #ff3b30; background: rgba(255,59,48,0.15); display: none; pointer-events: none; }
  #result { margin-top: 20px; padding: 15px; background: #f5f5f5; border-radius: 6px; white-space: pre-wrap; min-height: 40px; font-size: 15px; }
  #status { color: #666; font-size: 13px; margin-top: 8px; }
  button { padding: 8px 16px; margin-top: 10px; cursor: pointer; }
  .hint { color: #888; font-size: 13px; margin-bottom: 10px; }
</style>
</head>
<body>
<h2>Region OCR</h2>
<p class="hint">Upload an image, then click-drag a box around just the text you want. Only that crop gets OCR'd — no whole-page auto-detection, so accuracy is much better on messy scans/photos.</p>

<div style="display:flex; gap:15px; flex-wrap:wrap; align-items:center; margin-bottom:10px;">
  <label style="font-size:14px;">Engine:
    <select id="engineSelect">
      <option value="tesseract">Tesseract (free, offline)</option>
      <option value="claude" selected>Claude AI (best accuracy, needs SK)</option>
    </select>
  </label>
  <label style="font-size:14px;" id="langLabel" style="display:none;">Language:
    <select id="langSelect">
      <option value="eng">English</option>
      <option value="tam">Tamil</option>
      <option value="tam+eng" selected>Tamil + English</option>
    </select>
  </label>
</div>
<div id="skRow" style="margin-bottom:10px;">
  <input type="password" id="skInput" placeholder="Paste Claude SK (sk-ant-...)" style="width:280px; max-width:70%; padding:6px; font-size:13px;">
  <button id="saveSk" style="padding:6px 12px;">Save</button>
  <span id="skStatus" style="font-size:12px; color:#666; margin-left:8px;"></span>
</div>

<label for="fileInput" id="dropzone" style="display:block;">Tap to pick an image or take a photo</label>
<input type="file" id="fileInput" accept="image/*" style="position:absolute;left:-9999px;">

<div id="canvasWrap" style="display:none;">
  <canvas id="imgCanvas"></canvas>
  <div id="selBox"></div>
</div>

<div id="status"></div>
<div id="result"></div>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const canvasWrap = document.getElementById('canvasWrap');
const canvas = document.getElementById('imgCanvas');
const ctx = canvas.getContext('2d');
const selBox = document.getElementById('selBox');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');

let img = null;
let scale = 1;
let dragging = false, startX, startY;

fileInput.onchange = e => loadFile(e.target.files[0]);
dropzone.ondragover = e => e.preventDefault();
dropzone.ondrop = e => { e.preventDefault(); loadFile(e.dataTransfer.files[0]); };

async function loadFile(file) {
  if (!file) { statusEl.textContent = 'No file selected.'; return; }
  statusEl.textContent = 'Loading image (' + Math.round(file.size/1024) + ' KB, ' + (file.type || 'unknown type') + ')...';

  // iPhone HEIC/HEIF — browsers can't render these natively, convert to JPEG first
  const isHeic = /heic|heif/i.test(file.type) || /\.hei[cf]$/i.test(file.name);
  if (isHeic) {
    statusEl.textContent = 'Converting iPhone HEIC image to JPEG...';
    try {
      const jpegBlob = await heic2any({ blob: file, toType: 'image/jpeg', quality: 0.9 });
      file = new File([jpegBlob], file.name.replace(/\.hei[cf]$/i, '.jpg'), { type: 'image/jpeg' });
    } catch (err) {
      statusEl.textContent = 'HEIC conversion failed: ' + err.message + '. Try saving the photo as JPG on your phone first.';
      return;
    }
  }

  // createObjectURL handles large photos faster than FileReader and uses less memory
  // (important on mobile Edge, which can silently fail with multi-MB base64 data URLs)
  const url = URL.createObjectURL(file);
  img = new Image();
  img.onload = () => {
    URL.revokeObjectURL(url);
    const maxW = Math.min(window.innerWidth - 30, 1200);
    scale = Math.min(1, maxW / img.width);
    canvas.width = img.width * scale;
    canvas.height = img.height * scale;
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    canvasWrap.style.display = 'inline-block';
    resultEl.textContent = '';
    statusEl.textContent = 'Drag a box around the text you want to read.';
  };
  img.onerror = () => {
    URL.revokeObjectURL(url);
    statusEl.textContent = 'Could not load this image. If it is HEIC (iPhone format), convert to JPG first. Otherwise try a different image.';
  };
  img.src = url;
}

function getPos(e) {
  const r = canvas.getBoundingClientRect();
  if (e.touches && e.touches.length) {
    return { x: e.touches[0].clientX - r.left, y: e.touches[0].clientY - r.top };
  }
  if (e.changedTouches && e.changedTouches.length) {
    return { x: e.changedTouches[0].clientX - r.left, y: e.changedTouches[0].clientY - r.top };
  }
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function dragStart(e) {
  e.preventDefault();
  const p = getPos(e);
  startX = p.x; startY = p.y;
  dragging = true;
  selBox.style.display = 'block';
  selBox.style.left = startX + 'px';
  selBox.style.top = startY + 'px';
  selBox.style.width = '0px';
  selBox.style.height = '0px';
}

function dragMove(e) {
  if (!dragging) return;
  e.preventDefault();
  const p = getPos(e);
  selBox.style.left = Math.min(p.x, startX) + 'px';
  selBox.style.top = Math.min(p.y, startY) + 'px';
  selBox.style.width = Math.abs(p.x - startX) + 'px';
  selBox.style.height = Math.abs(p.y - startY) + 'px';
}

async function dragEnd(e) {
  if (!dragging) return;
  e.preventDefault();
  dragging = false;
  const p = getPos(e);
  const x = Math.min(startX, p.x), y = Math.min(startY, p.y);
  const w = Math.abs(p.x - startX), h = Math.abs(p.y - startY);
  if (w < 5 || h < 5) { selBox.style.display = 'none'; return; }

  // Map displayed-canvas coords back to full-res image coords
  const realX = x / scale, realY = y / scale, realW = w / scale, realH = h / scale;

  resultEl.textContent = '';
  const engine = document.getElementById('engineSelect').value;
  const lang = document.getElementById('langSelect').value;

  // Claude Vision prefers original color + resolution; Tesseract needs upscale + binarize
  const upscale = engine === 'claude' ? 1 : 3;
  const cropCanvas = document.createElement('canvas');
  cropCanvas.width = realW * upscale;
  cropCanvas.height = realH * upscale;
  const cctx = cropCanvas.getContext('2d');
  cctx.imageSmoothingEnabled = true;
  cctx.imageSmoothingQuality = 'high';
  cctx.drawImage(img, realX, realY, realW, realH, 0, 0, cropCanvas.width, cropCanvas.height);

  if (engine !== 'claude') {
    // Preprocess only for Tesseract: grayscale + contrast stretch
    const imgData = cctx.getImageData(0, 0, cropCanvas.width, cropCanvas.height);
    const d = imgData.data;
    for (let i = 0; i < d.length; i += 4) {
      const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      const v = gray > 170 ? 255 : gray < 100 ? 0 : (gray - 100) * 255 / 70;
      d[i] = d[i + 1] = d[i + 2] = v;
    }
    cctx.putImageData(imgData, 0, 0);
  }

  let data;
  try {
    if (engine === 'claude') {
      const sk = localStorage.getItem('ocr_sk');
      if (!sk) { statusEl.textContent = 'Paste your Claude SK above and press Save first.'; return; }
      statusEl.textContent = 'Sending to Claude vision...';
      const text = await claudeOCR(cropCanvas, sk);
      data = { text };
    } else {
      statusEl.textContent = 'Loading OCR model (first time only)...';
      const worker = await Tesseract.createWorker(lang, 1, {
        logger: m => {
          if (m.status && m.progress != null) {
            statusEl.textContent = m.status + ' ' + Math.round(m.progress * 100) + '%';
          }
        }
      });
      await worker.setParameters({ tessedit_pageseg_mode: '6' });
      const r = await worker.recognize(cropCanvas);
      await worker.terminate();
      data = r.data;
    }
    resultEl.textContent = data.text.trim() || '(no text detected — try: a bigger box, a flatter/better-lit photo, or hold the camera straight above the page)';
    if (data.text.trim()) {
      try {
        await navigator.clipboard.writeText(data.text.trim());
        statusEl.textContent = 'Done — copied to clipboard. Drag another box to read a different area.';
      } catch (copyErr) {
        statusEl.textContent = 'Done. (Couldn\'t auto-copy — long-press the text above to copy manually.) Drag another box to read a different area.';
      }
    } else {
      statusEl.textContent = 'Done. Drag another box to read a different area.';
    }
  } catch (err) {
    statusEl.textContent = 'OCR failed: ' + err.message;
  }
}

canvas.addEventListener('mousedown', dragStart);
canvas.addEventListener('mousemove', dragMove);
canvas.addEventListener('mouseup', dragEnd);
canvas.addEventListener('touchstart', dragStart, { passive: false });
canvas.addEventListener('touchmove', dragMove, { passive: false });
canvas.addEventListener('touchend', dragEnd, { passive: false });

// Engine / SK UI
const engineSel = document.getElementById('engineSelect');
const langLabel = document.getElementById('langLabel');
const skRow = document.getElementById('skRow');
const skInput = document.getElementById('skInput');
const skStatus = document.getElementById('skStatus');

function refreshEngineUI() {
  const isClaude = engineSel.value === 'claude';
  langLabel.style.display = isClaude ? 'none' : '';
  skRow.style.display = isClaude ? '' : 'none';
  if (isClaude) {
    const saved = localStorage.getItem('ocr_sk');
    skStatus.textContent = saved ? '✓ SK saved' : 'Not set';
  }
}
engineSel.onchange = refreshEngineUI;
document.getElementById('saveSk').onclick = () => {
  const v = skInput.value.trim();
  if (!v.startsWith('sk-ant-')) { skStatus.textContent = 'Invalid — should start with sk-ant-'; return; }
  localStorage.setItem('ocr_sk', v);
  skInput.value = '';
  skStatus.textContent = '✓ SK saved';
};
refreshEngineUI();

async function claudeOCR(canvasEl, sk) {
  // Compress canvas to JPEG to keep upload small
  const dataUrl = canvasEl.toDataURL('image/jpeg', 0.85);
  const base64 = dataUrl.split(',')[1];
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': sk,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-opus-5-5',
      max_tokens: 2000,
      messages: [{
        role: 'user',
        content: [
          { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: base64 } },
          { type: 'text', text: 'Transcribe every character of text visible in this image, exactly as written. The image may contain Tamil script, English, Hindi/Devanagari, or handwritten text. Preserve line breaks. Preserve all original spelling even if it looks wrong. Do not translate. Do not add commentary, quotes, markdown, or any text that is not in the image. If no text is visible, output only: (none)' }
        ]
      }]
    })
  });
  const j = await res.json();
  if (j.error) throw new Error(j.error.message || 'Claude API error');
  return j.content[0].text;
}
</script>
</body>
</html>
